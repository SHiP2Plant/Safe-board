<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>车间安全看板</title>
    <style>
        /* 基础页面设置 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
        }

        /* 16:9 比例画板，使用您指定的背景图片名称 */
        .board {
            position: relative;
            background-image: url('image_ac6121.jpg'); /* 已经改回原来的名字 */
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            width: 100vw;
            height: 56.25vw; 
        }

        /* 超宽屏适配限制 */
        @media (min-aspect-ratio: 16/9) {
            .board {
                width: 177.78vh;
                height: 100vh;
            }
        }

        /* 数据容器：锁定在顶部文字和底部插图之间的空白区域 */
        .data-container {
            position: absolute;
            top: 33%;    /* 起始位置在顶部两行标题下方 */
            height: 32%; /* 容器高度刚好填满中间空白处，利用 flex 自动垂直居中 */
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 动态数字：绿色、大字号 */
        .dynamic-number {
            font-size: 12vw; 
            font-weight: bold;
            color: #07c160; /* 绿色 */
            line-height: 1;
        }

        /* 动态单位：包含天字、绿色、双语展示 */
        .dynamic-unit {
            font-size: 3.5vw;
            font-weight: bold;
            color: #07c160; /* 绿色 */
            margin-left: 25px;
            margin-top: 4vw; /* 微调单位的垂直对齐，使其重心稳定 */
        }

        /* 针对超宽屏的字号上限限制 */
        @media (min-aspect-ratio: 16/9) {
            .dynamic-number { font-size: 21.3vh; }
            .dynamic-unit { font-size: 6.2vh; margin-top: 7vh; }
        }
    </style>
</head>
<body>

    <div class="board">
        <!-- 数据展示区，在中间空白处居中 -->
        <div class="data-container">
            <div class="dynamic-number" id="safe-days">计算中...</div>
            <div class="dynamic-unit">天 / Days</div>
        </div>
    </div>

    <script>
        function calculateSafeDays() {
            // 起始日期：2015年10月30日
            const startDate = new Date(2015, 9, 30);
            const currentDate = new Date();
            
            // 计算时间差并转换为天数
            const timeDiff = currentDate.getTime() - startDate.getTime();
            const daysDiff = Math.floor(timeDiff / (1000 * 60 * 60 * 24));
            
            // 更新页面数字
            document.getElementById('safe-days').innerText = daysDiff;
        }

        // 初始化加载
        calculateSafeDays();

        // 每 1 小时刷新一次
        setInterval(calculateSafeDays, 1000 * 60 * 60);
    </script>
</body>
</html>
